(function(){
  const card = document.getElementById("qz-card");
  const MIN = Math.log10(100), MAX = Math.log10(200000);
  let i = 0, total = 0, res = [];
  const goal = g => { try { window.ym && ym(114022016, "reachGoal", g) } catch(e){} };
  const fmt = n => { n = Math.round(n); if (n >= 10000) n = Math.round(n/1000)*1000; else if (n >= 1000) n = Math.round(n/100)*100; else n = Math.round(n/10)*10;
    const y = n % 100 >= 11 && n % 100 <= 14 ? "лет" : ({1:"год",2:"года",3:"года",4:"года"})[n % 10] || "лет";
    return n.toLocaleString("ru-RU") + " " + y; };
  const val = v => Math.pow(10, MIN + (MAX - MIN) * v / 1000);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function ask(){
    const q = QZ[i];
    card.innerHTML = `<img class="qz-img" src="/images/${q.u}.webp" alt="">
      <div class="qz-body"><div class="qz-step"><span>Находка ${i+1} из ${QZ.length}</span><span>${total} очков</span></div>
      <div class="qz-bar"><i style="width:${i/QZ.length*100}%"></i></div>
      <p class="qz-q">${esc(q.q)}</p>
      <div class="qz-val" id="v"></div>
      <input class="qz-range" id="r" type="range" min="0" max="1000" value="500" aria-label="Возраст находки">
      <div class="qz-scale"><span>100 лет</span><span>1 000</span><span>10 000</span><span>200 000</span></div>
      <button class="qz-btn" id="go">Ответить</button></div>`;
    const r = card.querySelector("#r"), v = card.querySelector("#v");
    const upd = () => v.textContent = fmt(val(+r.value)); r.addEventListener("input", upd); upd();
    card.querySelector("#go").onclick = () => answer(val(+r.value));
    if (i === 0) goal("quiz_start");
  }
  function answer(g){
    const q = QZ[i], err = Math.abs(Math.log10(g / q.a));
    const pts = Math.max(0, Math.round(100 - err * 110));
    total += pts; res.push({q, g, pts});
    const msg = pts >= 90 ? "В точку!" : pts >= 65 ? "Очень близко." : pts >= 35 ? "Неплохо." : g > q.a ? "Намного моложе." : "Намного древнее!";
    const b = card.querySelector(".qz-body");
    b.querySelector("#go").remove(); b.querySelector("#r").disabled = true;
    b.insertAdjacentHTML("beforeend", `<div class="qz-res"><b>${msg} +${pts}</b><br>Ваш ответ: ${fmt(g)}. На самом деле: <b>около ${fmt(q.a)}</b>.<br>${esc(q.x)}</div>
      <button class="qz-btn" id="nx">${i + 1 < QZ.length ? "Следующая находка →" : "Узнать результат"}</button>`);
    b.querySelector(".qz-step span:last-child").textContent = total + " очков";
    b.querySelector("#nx").onclick = () => { i++; i < QZ.length ? ask() : final(); window.scrollTo({top: document.getElementById("qz").offsetTop - 70, behavior: "smooth"}); };
  }
  function final(){
    let n = 0; LV.forEach((l, k) => { if (total >= l.m) n = k; });
    const L = LV[n], url = location.origin + "/test/r/" + (n + 1) + "/";
    const txt = `Мой результат ${total} из 1000 в тесте «Сколько лет этой находке?» и звание «${L.t}». А вы сможете больше?`;
    let best = 0; try { best = +localStorage.getItem("nvp_quiz") || 0; if (total > best) localStorage.setItem("nvp_quiz", total); } catch(e){}
    goal("quiz_done");
    card.innerHTML = `<div class="qz-final"><span class="kicker">Ваш результат</span>
      <div class="qz-score">${total}</div><div style="color:var(--muted)">из 1000${best && best > total ? ` · ваш рекорд ${best}` : ""}</div>
      <div class="qz-rank">«${esc(L.t)}»</div><div style="color:var(--muted)">${esc(L.s)}</div>
      <div class="qz-share">
        <a class="qz-vk" target="_blank" rel="noopener" data-g="vk" href="https://vk.com/share.php?url=${encodeURIComponent(url)}&title=${encodeURIComponent(txt)}">Поделиться ВКонтакте</a>
        <a class="qz-ok" target="_blank" rel="noopener" data-g="ok" href="https://connect.ok.ru/offer?url=${encodeURIComponent(url)}&title=${encodeURIComponent(txt)}">В Одноклассники</a>
        <a class="qz-tg" target="_blank" rel="noopener" data-g="tg" href="https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(txt)}">В Telegram</a>
        <button class="qz-again" id="ag">Пройти ещё раз</button>
      </div>
      <div class="qz-list"><b style="margin-top:8px">Читайте истории этих находок:</b>${res.map(x => `<a href="${SLUG && SLUG[x.q.u] ? "/st/" + SLUG[x.q.u] + "/" : "/"}"><span>${esc(x.q.x.split(",")[0].split(".")[0])}</span><span>+${x.pts}</span></a>`).join("")}</div></div>`;
    card.querySelectorAll("[data-g]").forEach(a => a.addEventListener("click", () => goal("quiz_share_" + a.dataset.g)));
    card.querySelector("#ag").onclick = () => { i = 0; total = 0; res = []; ask(); };
  }
  ask();
})();

</script>
