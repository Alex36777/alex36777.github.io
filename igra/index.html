<script>
const A = [{"u": "avKU-7VJOAanHgZ2", "t": "В пещере нашли следы трёхлетнего ребёнка. 14 тысяч лет назад он забрался туда вместе со взрослыми", "c": "under", "a": 14000.0, "s": "v-peschere-nashli-sledy-trehletnego-rebenka-14-tysyach-let"}, {"u": "avKzFnKMdiW3P6MQ", "t": "На Сицилии нашли мозаику с девушками в «бикини». Ей почти 1700 лет", "c": "arch", "a": 1700.0, "s": "na-sicilii-nashli-mozaiku-s-devushkami-v-bikini-ey-pochti-1700"}, {"u": "auow3Vf2JX2_tD-z", "t": "Шеститонный камень Стоунхенджа оказался «чужим». Его путь мог составить 750 километров", "c": "arch", "a": null, "s": "shestitonnyy-kamen-stounhendzha-okazalsya-chuzhim-ego-put-mog"}, {"u": "avA9Bd4iqVzJT3nm", "t": "Из болота подняли деревянную фигуру возрастом 12 000 лет. Кто вырезал на ней лица?", "c": "arch", "a": null, "s": "iz-bolota-podnyali-derevyannuyu-figuru-vozrastom-12-000-let-kto"}, {"u": "avA-kss0iwvELzox", "t": "600 лет никто не может прочитать эту книгу. Внутри растения, звёзды и странные слова", "c": "space", "a": 600.0, "s": "600-let-nikto-ne-mozhet-prochitat-etu-knigu-vnutri-rasteniya"}, {"u": "auovABPph27GT__1", "t": "В алтайском кургане нашли женщину с татуировками. Лёд сохранил их 2500 лет", "c": "arch", "a": 2500.0, "s": "v-altayskom-kurgane-nashli-zhenschinu-s-tatuirovkami-led"}, {"u": "auq_oimTMhbxJBhT", "t": "В соляной шахте нашли лестницу возрастом 3100 лет. Её ступени пережили целые государства", "c": "arch", "a": 3100.0, "s": "v-solyanoy-shahte-nashli-lestnicu-vozrastom-3100-let-ee-stupeni"}, {"u": "auq-lHCyIHNHvvC6", "t": "В пустыне построили город на скалах. Его спасала невидимая система водопроводов", "c": "arch", "a": null, "s": "v-pustyne-postroili-gorod-na-skalah-ego-spasala-nevidimaya"}, {"u": "auopoxPph27GR1h-", "t": "Под городом нашли подземный лабиринт. Внутри покоились останки 7000 человек", "c": "under", "a": null, "s": "pod-gorodom-nashli-podzemnyy-labirint-vnutri-pokoilis-ostanki"}, {"u": "auotxm_LXlExq-C6", "t": "На высоте 5000 метров нашли озеро, окружённое сотн function fmtAge(y){if(y>=1e9)return(Math.round(y/1e8)/10+"").replace(".",",")+" млрд лет";if(y>=1e6)return Math.round(y/1e6)+" млн лет";if(y>=1e4)return Math.round(y/1e3)+" тыс. лет";if(y>=1000){var k=Math.round(y/100)/10;return (k+"").replace(".",",")+" тыс. лет"}var n=Math.round(y);var m10=n%10,m100=n%100;var w=(m10==1&&m100!=11)?"год":(m10>=2&&m10<=4&&(m100<10||m100>=20))?"года":"лет";return n+" "+w}
function nice(y){if(y<100)return Math.max(5,Math.round(y/5)*5);if(y<1000)return Math.round(y/50)*50;if(y<10000)return Math.round(y/500)*500;if(y<1e5)return Math.round(y/5000)*5000;if(y<1e6)return Math.round(y/5e4)*5e4;return Math.round(y/Math.pow(10,Math.floor(Math.log10(y))-1))*Math.pow(10,Math.floor(Math.log10(y))-1)}
function ageOpts(a){var f=shuffle([[0.1,0.3,3],[0.3,3,10],[0.25,0.5,4],[0.2,2,6],[0.4,2.5,8]])[0];var out=[a];f.forEach(function(k){var v=nice(a*k);if(out.every(function(o){return fmtAge(o)!==fmtAge(v)}))out.push(v)});var k=12;while(out.length<4){var v=nice(a*k);if(out.every(function(o){return fmtAge(o)!==fmtAge(v)}))out.push(v);k*=3}return shuffle(out)}
function mask(t){return t.replace(/\d[\d\s.,]*\d|\d/g,"■■")}
var AGE=Q.map(function(q){var x=A.filter(function(a){return a.u===q.u})[0]||{};return{u:q.u,q:q.q,a:q.a,s:x.s||"",t:x.t||q.q}}).concat(A.filter(function(a){return a.a&&a.a>=30&&!Q.some(function(q){return q.u===a.u})}).map(function(a){return{u:a.u,q:mask(a.t),a:a.a,s:a.s,t:a.t}}));

function layer(){return Math.min(LAYERS.length-1,Math.floor(S.right/PER))}
function limit(){return Math.max(8,16-layer()*1.6)}
function mult(){return S.streak>=8?3:S.streak>=4?2:1}

function newGame(){S={score:0,right:0,lives:3,streak:0,used:[],miss:[],qn:0,best:+(LS.g("ig_best")||0)};goal("igra_start");next()}
function next(){
  if(S.lives<=0)return end();
  S.qn++;
  var useAge=(S.qn%3===0)&&AGE.length,item,q,opts,correct,kind;
  if(useAge){var pool=AGE.filter(function(x){return S.used.indexOf(x.u)<0});if(!pool.length)pool=AGE;item=pool[Math.floor(Math.random()*pool.length)];kind="age";q="Сколько лет этой находке?";var ao=ageOpts(item.a);opts=ao.map(fmtAge);correct=fmtAge(item.a)}
  else{var lay=layer();var pool2=A.filter(function(x){return S.used.indexOf(x.u)<0});if(pool2.length<4)pool2=A;item=pool2[Math.floor(Math.random()*pool2.length)];kind="photo";q="Из какой истории эта находка?";
    var same=A.filter(function(x){return x.c===item.c&&x.u!==item.u});var others=A.filter(function(x){return x.u!==item.u});
    var src=(lay>=2&&same.length>=3)?same:others;var d=pick(src,3,[]);opts=shuffle([item].concat(d)).map(function(x){return x.t});correct=item.t}
  S.used.push(item.u);S.cur={item:item,kind:kind,correct:correct};
  var L=LAYERS[layer()],strata="";for(var i=0;i<LAYERS.length;i++)strata+='<i class="'+(i<=layer()?"on":"")+'"></i>';
  var hearts="";for(var h=0;h<3;h++)hearts+='<span class="'+(h<S.lives?"":"off")+'">🏺</span>';
  el.innerHTML='<div class="ig-hud"><div class="ig-score"><small>Очки</small><span id="sc">'+S.score.toLocaleString("ru")+'</span></div><span class="ig-mult'+(mult()>1?" on":"")+'" title="Множитель за серию">×'+mult()+'</span><span class="ig-lives" aria-label="Жизни: '+S.lives+'">'+hearts+'</span></div>'+
  '<div class="ig-depth"><span>Глубина '+L[1]+' · <b>'+L[0]+'</b></span><span class="ig-strata" aria-hidden="true">'+strata+'</span></div>'+
  '<div class="ig-timer" id="tm"><i id="tmi"></i></div>'+
  '<div class="ig-img"><img src="'+img(item.u)+'" alt=""><span class="tag">'+esc(kind==="age"?"Возраст":CAT[item.c]||"Находка")+'</span><span class="ig-pts" id="pts"></span></div>'+
  '<div class="ig-body"><p class="ig-q">'+esc(q)+(kind==="age"?'<br><span style="color:var(--muted);font-weight:400;font-size:16px">'+esc(item.q)+'</span>':'')+'</p><div class="ig-opts'+(kind==="age"?" two":"")+'" id="op"></div></div>';
  var op=document.getElementById("op");
  opts.forEach(function(o){var b=document.createElement("button");b.type="button";b.className="ig-opt"+(kind==="age"?" big":"");b.textContent=o;b.addEventListener("click",function(){answer(o,b)});op.appendChild(b)});
  var n=new Image();var nx=A[Math.floor(Math.random()*A.length)];n.src=img(nx.u);
  var r=el.getBoundingClientRect();if(r.top<0||r.top>innerHeight*.4)scrollTo({top:scrollY+r.top-8,behavior:S.qn===1?"smooth":"auto"});
  S.t0=performance.now();S.lim=limit()*1000;clearInterval(S.iv);S.iv=setInterval(tick,100);
}
function tick(){var left=1-(performance.now()-S.t0)/S.lim;var i=document.getElementById("tmi");if(!i)return;i.style.transform="scaleX("+Math.max(0,left)+")";document.getElementById("tm").classList.toggle("low",left<.3);if(left<=0){answer(null,null)}}
function answer(o,btn){
  if(S.cur.done)return;S.cur.done=true;clearInterval(S.iv);
  var ok=o===S.cur.correct,btns=document.querySelectorAll(".ig-opt");
  btns.forEach(function(b){b.disabled=true;if(b.textContent===S.cur.correct)b.classList.add("ok")});
  if(ok){var left=Math.max(0,1-(performance.now()-S.t0)/S.lim);S.streak++;var pts=Math.round((100+left*100)*mult()*(1+layer()*.25));S.score+=pts;S.right++;var p=document.getElementById("pts");p.textContent="+"+pts;p.classList.add("fly");document.getElementById("sc").textContent=S.score.toLocaleString("ru")}
  else{if(btn)btn.classList.add("bad");S.streak=0;S.lives--;S.miss.push(S.cur.item)}
  setTimeout(next,ok?900:1700);
}
function end(){
  goal("igra_done");var r0=el.getBoundingClientRect();if(r0.top<0)scrollTo({top:scrollY+r0.top-8});
  var L=LAYERS[layer()],newBest=S.score>S.best;if(newBest)LS.s("ig_best",S.score);
  var hist=[];try{hist=JSON.parse(LS.g("ig_hist")||"[]")}catch(e){}
  hist.push({s:S.score,d:L[0],t:Date.now()});hist.sort(function(a,b){return b.s-a.s});LS.s("ig_hist",JSON.stringify(hist.slice(0,10)));
  var miss=S.miss.filter(function(x,i,a){return a.indexOf(x)===i}).slice(0,3);
  var url="https://nevsetakprosto.ru/igra/",txt="Я набрал "+S.score+" очков в игре «Археолог» и докопался до слоя «"+L[0]+"». Сможете глубже?";
  el.innerHTML='<div class="ig-end"><span class="kicker">Раскопки окончены</span><div class="ig-final">'+S.score.toLocaleString("ru")+'</div>'+
  '<p class="ig-sub">Вы докопались до слоя <b>«'+esc(L[0])+'»</b> ('+L[1]+') и узнали '+S.right+' '+(S.right%10==1&&S.right%100!=11?"находку":(S.right%10>=2&&S.right%10<=4&&(S.right%100<10||S.right%100>=20))?"находки":"находок")+'.</p>'+
  (newBest&&S.score>0?'<span class="ig-best">Новый личный рекорд!</span>':(S.best?'<span class="ig-best" style="opacity:.75">Ваш рекорд: '+S.best.toLocaleString("ru")+'</span>':''))+
  (LB.url&&S.score>0?'<form class="ig-name" id="nf"><input id="nm" maxlength="20" placeholder="Ваше имя для таблицы" autocomplete="nickname" value="'+esc(LS.g("ig_name")||"")+'" required><button class="ig-go" type="submit">В таблицу</button></form><p class="ig-msg" id="msg"></p>':'')+
  '<div class="ig-btns"><button class="ig-go" type="button" id="again">Копать ещё раз</button><a class="ig-go ghost" style="text-decoration:none;display:block" href="/test/">Пройти тест на возраст</a></div>'+
  '<div class="ig-share"><a href="https://vk.com/share.php?url='+encodeURIComponent(url)+'&title='+encodeURIComponent(txt)+'" target="_blank" rel="noopener" data-sh="vk">Поделиться ВКонтакте</a><a href="https://connect.ok.ru/offer?url='+encodeURIComponent(url)+'&title='+encodeURIComponent(txt)+'" target="_blank" rel="noopener" data-sh="ok">Одноклассники</a><a href="https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(txt)+'" target="_blank" rel="noopener" data-sh="tg">Telegram</a></div>'+
  (miss.length?'<div class="ig-miss"><h3>Эти находки вас подвели</h3>'+miss.map(function(x){return'<a class="ig-mini" href="'+link(x)+'"><img src="'+img(x.u)+'" alt="" loading="lazy"><span>'+esc(x.t)+'</span></a>'}).join("")+'</div>':'')+
  '</div>';
  document.getElementById("again").addEventListener("click",newGame);
  document.querySelectorAll("[data-sh]").forEach(function(a){a.addEventListener("click",function(){goal("igra_share_"+a.dataset.sh)})});
  var f=document.getElementById("nf");if(f)f.addEventListener("submit",function(e){e.preventDefault();var n=document.getElementById("nm").value.trim();if(!n)return;if(BAD.test(n.toLowerCase())){document.getElementById("msg").textContent="Выберите другое имя.";return}LS.s("ig_name",n);send(n,S.score,L[0])});
  board();
}
var BAD=/(хуй|хуе|хуё|пизд|ебa|еба|ёба|ебл|ебу|бля|сука|суки|мудак|пидор|пидар|залуп|гандон|шлюх|fuck|shit|dick|cunt)/;
function send(n,s,d){var m=document.getElementById("msg"),b=document.querySelector("#nf button");b.disabled=true;m.textContent="Записываем…";
  fetch(LB.url+"/rest/v1/scores",{method:"POST",headers:{"apikey":LB.key,"Authorization":"Bearer "+LB.key,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({name:n.slice(0,20),score:s,depth:d})})
  .then(function(r){if(!r.ok)throw 0;m.textContent="Готово! Вы в таблице.";goal("igra_lb");document.getElementById("nf").remove();S.sent=n;board()}).catch(function(){m.textContent="Не получилось записать. Попробуйте ещё раз.";b.disabled=false})}
var TAB=LS.g("ig_tab")||"week";
function monday(){var d=new Date();var k=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-k);return d.toISOString()}
function board(){
  var head='<h2>Лучшие археологи</h2><div class="lb-tabs" role="group" aria-label="Период">'+(LB.url?'<button type="button" data-t="week" aria-pressed="'+(TAB==="week")+'">Эта неделя</button><button type="button" data-t="all" aria-pressed="'+(TAB==="all")+'">За всё время</button>':"")+'<button type="button" data-t="me" aria-pressed="'+(TAB==="me"||!LB.url)+'">Мои рекорды</button></div><div id="lbt"></div>';
  lbEl.innerHTML=head;
  lbEl.querySelectorAll("[data-t]").forEach(function(b){b.addEventListener("click",function(){TAB=b.dataset.t;LS.s("ig_tab",TAB);board()})});
  var t=document.getElementById("lbt");
  if(TAB==="me"||!LB.url){var h=[];try{h=JSON.parse(LS.g("ig_hist")||"[]")}catch(e){}
    t.innerHTML=h.length?table(h.map(function(x){return{name:new Date(x.t).toLocaleDateString("ru",{day:"numeric",month:"long"}),score:x.s,depth:x.d}}),null):'<p class="lb-empty">Здесь появятся ваши результаты. Сыграйте первую партию!</p>';return}
  t.innerHTML='<p class="lb-empty">Загружаем таблицу…</p>';
  var q=LB.url+"/rest/v1/scores?select=name,score,depth&order=score.desc&limit=10"+(TAB==="week"?"&created_at=gte."+encodeURIComponent(monday()):"");
  fetch(q,{headers:{"apikey":LB.key,"Authorization":"Bearer "+LB.key}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(rows){t.innerHTML=rows.length?table(rows,S&&S.sent):'<p class="lb-empty">На этой неделе ещё никто не копал. Станьте первым!</p>'}).catch(function(){t.innerHTML='<p class="lb-empty">Таблица временно недоступна.</p>'})}
function table(rows,me){return'<table class="lb-t"><tbody>'+rows.map(function(r,i){return'<tr'+(me&&r.name===me?' class="me"':'')+'><td class="n">'+(i+1)+'</td><td>'+esc(r.name)+'</td><td class="d">'+esc(r.depth||"")+'</td><td class="s">'+(+r.score).toLocaleString("ru")+'</td></tr>'}).join("")+'</tbody></table>'}

function start(){var best=+(LS.g("ig_best")||0);
  el.innerHTML='<div class="ig-start"><ul class="ig-rules">'+
  '<li><span class="i">🔎</span><span>Узнайте находку по фото или угадайте её возраст. <b>Чем быстрее ответ, тем больше очков.</b></span></li>'+
  '<li><span class="i">⛏️</span><span>Каждые '+PER+' верных ответов вы спускаетесь на слой глубже. <b>Там находки древнее, а очков больше.</b></span></li>'+
  '<li><span class="i">🔥</span><span>Серия верных ответов умножает очки: <b>×2, потом ×3</b>.</span></li>'+
  '<li><span class="i">🏺</span><span>У вас <b>3 жизни</b>. Ошибка или пропущенное время забирает одну.</span></li></ul>'+
  (best?'<span class="ig-best">Ваш рекорд: '+best.toLocaleString("ru")+'</span>':'')+
  '<button class="ig-go" type="button" id="go">Начать раскопки</button></div>';
  document.getElementById("go").addEventListener("click",newGame);board()}
start();
if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})});
})();
</script>
